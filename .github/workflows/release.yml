# On every push to main: build, then publish a GitHub release with an automatic version
# (version from gradle.properties + the workflow run number, e.g. v1.2.0-build.7) containing the mod jar.

name: release
on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: validate gradle wrapper
        uses: gradle/actions/wrapper-validation@v6
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'microsoft'
      - name: make gradle wrapper executable
        run: chmod +x ./gradlew
      - name: build
        run: ./gradlew build
      - name: compute version
        id: ver
        run: |
          base=$(grep -E '^version=' gradle.properties | cut -d= -f2 | tr -d '\r ')
          echo "tag=v${base}-build.${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
      - name: create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          jar=$(ls build/libs/*.jar | grep -v -- '-sources.jar' | head -n 1)
          gh release create "${{ steps.ver.outputs.tag }}" "$jar" \
            --target "$GITHUB_SHA" \
            --title "${{ steps.ver.outputs.tag }}" \
            --generate-notes
